[unix_http_server]
file=/tmp/supervisor.sock

[supervisord]
nodaemon = true
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /tmp/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl = unix:///tmp/supervisor.sock

[program:php-fpm]
command = php-fpm -F
autostart = true
autorestart = true
stdout_logfile = /dev/fd/1
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/fd/2
stderr_logfile_maxbytes = 0

# NOTE: the queue worker no longer runs here — it is a dedicated
# `queue` service in docker-compose.yml (php artisan queue:work).

[program:scheduler]
# Runs `php artisan schedule:run` every minute -> app:daily-maintenance reminders
command = php artisan schedule:work
directory = /var/www/html
user = www-data
autostart = true
autorestart = true
stdout_logfile = /dev/fd/1
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/fd/2
stderr_logfile_maxbytes = 0